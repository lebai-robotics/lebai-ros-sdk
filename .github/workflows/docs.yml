name: Build versioned documentation

on:
  workflow_dispatch:
  push:
    branches:
      - humble-dev
      - jazzy-dev
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build documentation versions
        shell: bash
        run: |
          set -euo pipefail

          SITE="$GITHUB_WORKSPACE/public"
          WORK="/tmp/lebai-ros-sdk-docs"

          rm -rf "$SITE" "$WORK"
          mkdir -p "$SITE" "$WORK"

          versions=()
          if git rev-parse --verify --quiet origin/humble-dev >/dev/null; then
            versions+=("origin/humble-dev humble Humble")
          fi
          if git rev-parse --verify --quiet origin/jazzy-dev >/dev/null; then
            versions+=("origin/jazzy-dev jazzy Jazzy")
          fi
          if git rev-parse --verify --quiet origin/main >/dev/null; then
            versions+=("origin/main latest Latest")
          fi

          if [ "${#versions[@]}" -eq 0 ]; then
            versions+=("HEAD humble Humble")
          fi

          cp docs/_static/version-switcher.js "$SITE/version-switcher.js"
          printf '[\n' > "$SITE/versions.json"
          first=1

          for item in "${versions[@]}"; do
            read -r ref folder label <<< "$item"
            echo "Building $label from $ref into /$folder/"

            git worktree add --detach "$WORK/$folder" "$ref"

            pushd "$WORK/$folder"
            python3 -m pip install -r docs/requirements.txt
            ./scripts/build-docs.sh
            popd

            mkdir -p "$SITE/$folder"
            cp -a "$WORK/$folder/site/." "$SITE/$folder/"

            if [ "$first" -eq 0 ]; then
              printf ',\n' >> "$SITE/versions.json"
            fi
            first=0
            printf '  {"label":"%s","path":"%s"}' "$label" "$folder" >> "$SITE/versions.json"
          done

          if git rev-parse --verify --quiet origin/gh-pages >/dev/null; then
            git worktree add --detach "$WORK/legacy-gh-pages" origin/gh-pages
            mkdir -p "$SITE/legacy"
            cp -a "$WORK/legacy-gh-pages/." "$SITE/legacy/"
          fi

          printf '\n]\n' >> "$SITE/versions.json"

          cat > "$SITE/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=humble/">
          <link rel="canonical" href="humble/">
          HTML

          touch "$SITE/.nojekyll"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
