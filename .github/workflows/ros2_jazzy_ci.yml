name: ROS2 Jazzy CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - jazzy-dev
  push:
    branches:
      - jazzy-dev

permissions:
  contents: read

jobs:
  jazzy:
    name: Jazzy unit and simulator tests
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
      options: --user 0
    services:
      lmaster:
        image: registry.cn-shanghai.aliyuncs.com/lebai/l-master:latest
        options: >-
          --health-cmd="curl -f http://localhost:8080 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y \
            curl \
            git \
            python3-colcon-common-extensions \
            python3-pip \
            python3-pytest \
            python3-rosdep \
            python3-venv \
            python3-vcstool
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          for attempt in 1 2 3; do
            if rosdep update; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "rosdep update failed on attempt $attempt; retrying in 5 seconds" >&2
              sleep 5
            else
              echo "rosdep update failed after 3 attempts" >&2
              exit 1
            fi
          done
          python3 -m venv .venv --system-site-packages
          . .venv/bin/activate
          python3 -m pip install "pylebai>=2.0.0,<3.0.0"
          rosdep install \
            --from-paths . \
            --ignore-src \
            --rosdistro "$ROS_DISTRO" \
            --skip-keys pylebai \
            -y

      - name: Run linters
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source .venv/bin/activate
          PYTHONNOUSERSITE=1 ./scripts/run-linters.sh

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source .venv/bin/activate
          colcon build --symlink-install

      - name: Run unit tests
        shell: bash
        run: |
          set -eo pipefail
          source .venv/bin/activate
          source install/setup.bash
          python3 -m pytest lebai_driver/test -q -m "not integration and not linter"
          python3 -m pytest lebai_lm3_support/test/test_package_dependencies.py -q
          python3 -m pytest lebai_lm3_support/test -q
          PYTHONPATH=lebai_tutorials/scripts:$PYTHONPATH python3 -m pytest lebai_tutorials/test/test_package_dependencies.py -q
          PYTHONPATH=lebai_tutorials/scripts:$PYTHONPATH python3 -m pytest lebai_tutorials/test -q
          python3 -m pytest lebai_lm3_moveit_config/test/test_package_dependencies.py -q
          python3 -m pytest lebai_lm3_moveit_config/test -q

      - name: Run simulator smoke tests
        shell: bash
        env:
          LEBAI_TEST_ROBOT_IP: ""
        run: |
          set -eo pipefail
          source .venv/bin/activate
          source install/setup.bash
          export LEBAI_TEST_ROBOT_IP="$(getent hosts lmaster | awk '{print $1}')"
          python3 -m pytest lebai_driver/test/test_simulator_smoke.py -q -m integration
